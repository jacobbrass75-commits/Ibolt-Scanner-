# Installed as a new inventory-only vhost. Existing websites are unchanged.
limit_req_zone $binary_remote_addr zone=iboltscan_requests:1m rate=10r/s;
server {
    listen 80;
    server_name inventory.89.167.10.34.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/iboltscan-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name inventory.89.167.10.34.nip.io;
    ssl_certificate /etc/letsencrypt/live/inventory.89.167.10.34.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory.89.167.10.34.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200k;
    access_log /var/log/nginx/iboltscan-access.log;
    error_log /var/log/nginx/iboltscan-error.log;
    location = /healthz { return 404; }
    location / {
        limit_req zone=iboltscan_requests burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
}
